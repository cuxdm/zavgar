
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библия Завгарианина</title>
<link rel="icon" href="icons8-4chan-50.png" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0c0c0c;
            color: #f1f3f5;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 100px 20px 40px;
        }

        h1 {
            font-size: 36px;
            text-align: center;
            margin: 0 0 40px;
            text-shadow: 2px 2px 5px #000000;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 320px;
        }

        .buttons a {
            display: block;
            padding: 16px 20px;
            background: #1c222c;
            border: 1px solid #343d4b;
            border-radius: 10px;
            color: #f1f3f5;
            text-align: center;
            text-decoration: none;
            font-size: 17px;
            transition: 0.2s;
        }

        .buttons a:hover {
            background: #29364a;
            border-color: #7298df;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <h1>Библия Завгарианина</h1>

</html>
